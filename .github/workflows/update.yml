name: update-profile
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: [sites.json, build.py]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Сохранить, если изменилось
        run: |
          git diff --quiet -- README.md && { echo "без изменений"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Обновление профиля" && git push
